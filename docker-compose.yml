version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: mysql_hotel_db
    environment:
      MYSQL_ROOT_PASSWORD: "2005"
      MYSQL_DATABASE: hotel_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: spring_hotel_app
    ports:
      - "8080:8080"
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/hotel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "2005"

volumes:
  db_data: