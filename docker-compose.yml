services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_hotel_app
    restart: unless-stopped
    ports:
      - "8080:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "2005"