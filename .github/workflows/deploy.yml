name: Deploy Spring Boot App to VPS

on:
  push:
    branches:
      - main     # ដំណើរការ Pipeline តែពេល Push ទៅ branch main ប៉ុណ្ណោះ (អាចប្ដូរជា master បាន)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code ពី GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 21 JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build Project ជាមួយ Maven (Skip Test ដើម្បី Build ឱ្យលឿន)
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 4. Copy JAR file ទៅកាន់ VPS ដោយប្រើ SSH/SCP
      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "target/*.jar"
          target: "/var/www/hotel-api"
          strip_components: 1

      # 5. Restart Spring Boot Service លើ VPS
      - name: SSH and Restart App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo systemctl restart hotel-api
            sudo systemctl status hotel-api --no-pager